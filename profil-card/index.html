<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Card</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --primary: #6c63ff;
      --primary-light: #ede9ff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 40px 32px 32px;
      width: 320px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 32px 80px rgba(108, 99, 255, 0.25);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c63ff, #f093fb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      font-weight: 700;
      border: 4px solid var(--card);
      box-shadow: 0 0 0 3px var(--primary);
      transition: transform 0.3s ease;
    }

    .card:hover .avatar { transform: scale(1.06) rotate(3deg); }

    .badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      background: #22c55e;
      border-radius: 50%;
      border: 3px solid var(--card);
    }

    .name {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .title {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      background: var(--primary-light);
      display: inline-block;
      padding: 3px 12px;
      border-radius: 99px;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .stat { display: flex; flex-direction: column; gap: 2px; }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .actions { display: flex; gap: 12px; }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: #5a51e8;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    .btn:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar">SC</div>
      <div class="badge"></div>
    </div>
    <h2 class="name">Sophie Chen</h2>
    <span class="title">UI / UX Designer</span>
    <div class="stats">
      <div class="stat">
        <span class="stat-value">248</span>
        <span class="stat-label">Posts</span>
      </div>
      <div class="stat">
        <span class="stat-value">14.2k</span>
        <span class="stat-label">Followers</span>
      </div>
      <div class="stat">
        <span class="stat-value">512</span>
        <span class="stat-label">Following</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="this.textContent = this.textContent === 'Follow' ? 'Following ✓' : 'Follow'">Follow</button>
      <button class="btn btn-outline">Message</button>
    </div>
  </div>
</body>
</html>
